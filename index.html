<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triagem de atendimento · Vilela Oliveira Advogados Associados</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070A;--card:rgba(22,22,26,.78);--ink:#F1EBDC;--mut:#A89F8A;--acc:#D4AF5A;--accfg:#1A1406;--line:#34312A;--me:#D4AF5A;--mefg:#1A1406;--err:#FF8A80;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(120% 80% at 50% 0,#1a1608,var(--bg) 60%) fixed;color:var(--ink);font:400 16px/1.55 "Public Sans",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1}
.hero{height:44vh;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 8px}
.hero img{width:64px;height:64px;border-radius:50%;box-shadow:0 0 0 1px #C9A24B88,0 0 30px #C9A24B33}
.hero h1{font:600 clamp(18px,4.6vw,28px)/1.2 Cinzel,Georgia,serif;letter-spacing:.16em;margin:0;color:#E9CB82;text-shadow:0 2px 18px #000}
.hero p{margin:4px 0 0;font-size:13px;color:var(--mut)}
.bar{max-width:600px;margin:0 auto;padding:8px 16px 0}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut)}
.top button{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;cursor:pointer;padding:4px}
.track{height:5px;border-radius:5px;background:var(--line);margin-top:6px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#9A7420,#F0D58A);transition:width .5s}
main{max-width:600px;margin:0 auto;padding:16px 16px 30px}
#chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:90%;padding:11px 15px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.98)}}
.bot{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.me{background:var(--me);color:var(--mefg);border-bottom-right-radius:4px;align-self:flex-end;font-weight:600}
.dots{display:flex;gap:4px;padding:14px 16px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.sum{align-self:stretch;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--acc);border-radius:14px;padding:6px 16px;animation:in .35s ease-out}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.sum div:last-child{border:0}.sum span{color:var(--mut)}.sum b{text-align:right;font-weight:600}
#ctl{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt,.send,.act{font:600 15px "Public Sans",system-ui,sans-serif;border-radius:12px;padding:13px 16px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.opt{background:var(--card);backdrop-filter:blur(12px);color:var(--ink);border:1px solid var(--line);text-align:left}
.opt:hover{border-color:var(--acc);transform:translateX(4px)}
.send,.act{background:linear-gradient(180deg,#E6C877,#B88F33);color:var(--accfg);border:0;text-align:center;text-decoration:none;display:block}
.send:hover,.act:hover{transform:translateY(-1px)}
.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px}
.in,.sel{font:inherit;padding:13px;border-radius:12px;border:1px solid var(--line);background:rgba(10,10,12,.85);color:var(--ink);min-width:0}
.in{flex:1}.sel{width:84px}
.hint{color:var(--mut);font-size:13px;min-height:19px}.hint.e{color:var(--err)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
footer{max-width:600px;margin:0 auto;padding:0 16px 28px;color:var(--mut);font-size:12px}
@media(prefers-reduced-motion:reduce){.msg,.sum{animation:none}.dots i{animation:none}.fill{transition:none}}

#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:24px 20px calc(44px + env(safe-area-inset-bottom,0px));text-align:center;background:linear-gradient(180deg,#07070Ab8,#07070A00 38%,#07070Af0);transition:opacity 1s,visibility 1s}
#intro.off{opacity:0;visibility:hidden}
#intro img{width:88px;height:88px;border-radius:50%;box-shadow:0 0 0 1px #C9A24B99,0 0 50px #C9A24B44;animation:pop 1.3s cubic-bezier(.2,.9,.2,1) both}
#intro h2{font:600 clamp(28px,9vw,46px)/1.1 Cinzel,Georgia,serif;letter-spacing:.2em;margin:6px 0 0;background:linear-gradient(90deg,#B88F33,#FFF0B8,#B88F33);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite,rise 1.2s .3s both}
#intro p{margin:0;color:var(--mut);animation:rise 1.2s .6s both}
#intro .go{width:min(320px,100%);margin-top:10px;animation:rise 1.2s 1s both,glow 2.4s 2.2s infinite}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-25deg)}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes glow{50%{box-shadow:0 0 28px #E6C87799}}
.bot{position:relative;padding-left:48px;border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#E6C877aa,#2e2a1f 45%,#B88F3377) border-box;box-shadow:0 10px 30px #00000066}
.bot::before{content:"";position:absolute;left:11px;top:11px;width:27px;height:27px;border-radius:50%;background:var(--logo) center/cover;box-shadow:0 0 0 1px #C9A24B99}
.dots{padding:15px 16px 15px 48px}
.sum{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#E6C877,#5b4a1f,#B88F33) border-box;border:1px solid transparent;box-shadow:0 14px 40px #000000aa}
.send,.act{position:relative;overflow:hidden}
.send::after,.act::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,#fff7 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.send:hover::after,.act:hover::after{transform:translateX(120%)}
.sp{position:fixed;width:6px;height:6px;border-radius:50%;background:#F0D58A;pointer-events:none;z-index:9;box-shadow:0 0 10px #F0D58A;animation:sp .75s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@media(prefers-reduced-motion:reduce){#intro *{animation:none!important}.sp{display:none}}

body{overflow:hidden;height:100dvh}
#intro{background:linear-gradient(180deg,#0000 45%,#07070Af2)}
.app{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;max-width:640px;margin:0 auto;opacity:0;pointer-events:none;transition:opacity .9s .3s}
.app.on{opacity:1;pointer-events:auto}
.hd{position:relative;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:#0b0b0dd9;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd img{width:44px;height:44px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 1.5px #C9A24B;flex:none}
.who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.who b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--mut);font-size:12px}
.who small::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#5BD68A;margin-right:6px}
.tools{display:flex;gap:2px}.tools button{background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:6px;cursor:pointer}
.hd .track{position:absolute;left:0;right:0;bottom:-1px;height:3px;margin:0;border-radius:0}
main{max-width:none;margin:0;padding:14px 12px;flex:1;overflow-y:auto}
#chat{gap:6px}
.msg{padding:8px 12px 6px;max-width:84%}
.msg small{display:block;text-align:right;font-size:11px;opacity:.6;margin-top:2px;font-weight:400}
.bot,.dots{padding-left:13px}.bot::before{display:none}
.sys{align-self:center;max-width:92%;text-align:center;font-size:12px;color:var(--mut);background:#16161acc;border:1px solid var(--line);padding:6px 12px;border-radius:12px}
#ctl{margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#0b0b0de8;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);max-height:48vh;overflow-y:auto}
#ctl:empty{display:none}
.in{resize:none}textarea.in{min-height:76px}.row{align-items:flex-end}
.mic{width:50px;height:48px;flex:none;border-radius:12px;border:1px solid var(--line);background:rgba(10,10,12,.85);font-size:20px;cursor:pointer}
.mic.rec{background:#6b1c1c;border-color:#ff7b7b;animation:glow 1s infinite}
.pill{flex:1;display:flex;align-items:flex-end;min-width:0;background:rgba(10,10,12,.92);border:1px solid var(--line);border-radius:24px;padding:0 6px}
.pill:focus-within{border-color:var(--acc)}
.pill .in{border:0;background:transparent;padding:12px 10px;outline:none;border-radius:24px}
.rb{width:48px;height:48px;flex:none;border-radius:50%;border:0;background:#1FA855;color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .2s}
.rb:active{transform:scale(.92)}.rb.rec{background:#D93025;animation:glow 1s infinite}
.hint.rc{display:flex;align-items:center;gap:10px;color:#ff8a80}
.dot{width:9px;height:9px;border-radius:50%;background:#ff4d4d;animation:b 1s infinite}
.wv{display:flex;gap:3px;align-items:center;height:18px}.wv b{width:3px;height:6px;border-radius:2px;background:#ff8a80;animation:wv .8s ease-in-out infinite}
.wv b:nth-child(2){animation-delay:.1s}.wv b:nth-child(3){animation-delay:.2s}.wv b:nth-child(4){animation-delay:.3s}.wv b:nth-child(5){animation-delay:.4s}
@keyframes wv{50%{height:18px}}
</style>
</head>

const CPF=/\b\d{3}\.?\d{3}\.?\d{3}-?\d{2}\b/,MAIL=/\S+@\S+\.\S+/;
function okRelato(v){const w=v.split(/\s+/);if(v.length<15||w.length<4)return"Conte um pouco mais, em uma ou duas frases.";if(junk(v.replace(/[^A-Za-zÀ-ÿ\s]/g,'')))return"Não consegui entender o texto. Confira.";if(CPF.test(v)||MAIL.test(v))return"Retire CPF e e-mail do texto. Esses dados não precisam ir aqui.";return""}

const KW={"Previdenciário (INSS)":/inss|aposentad|benef[ií]cio|aux[ií]lio|pens[aã]o por morte|bpc|loas|per[ií]cia|previd/gi,"Trabalhista":/demit|demiss|empresa|patr[aã]o|carteira|fgts|rescis|horas? extras?|sal[aá]rio|trabalh|empregador/gi,"Consumidor":/compra|produto|loja|cobran[cç]a|cart[aã]o|banco|negativ|serasa|garantia|cancel|plano de sa[uú]de|entrega/gi,"Família":/div[oó]rcio|guarda|pens[aã]o aliment|uni[aã]o est[aá]vel|visita|separa[cç][aã]o|paternidade/gi,"Cível em geral":/alugu|despejo|contrato|indeniza|d[ií]vida|heran[cç]a|invent[aá]rio|vizinho|acidente/gi};

function guess(sel,v){let best=null,bs=0;for(const a in KW){if(a===sel)continue;const s=sc(a,v);if(s>bs){bs=s;best=a}}const cur=KW[sel]?sc(sel,v):0;return (bs>=2&&bs>cur)||(bs>=1&&cur===0)?best:null}
