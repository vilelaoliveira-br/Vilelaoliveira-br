<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triagem de atendimento · Vilela Oliveira Advogados Associados</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070A;--card:rgba(22,22,26,.78);--ink:#F1EBDC;--mut:#A89F8A;--acc:#D4AF5A;--accfg:#1A1406;--line:#34312A;--me:#D4AF5A;--mefg:#1A1406;--err:#FF8A80;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(120% 80% at 50% 0,#1a1608,var(--bg) 60%) fixed;color:var(--ink);font:400 16px/1.55 "Public Sans",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1}
.hero{height:44vh;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 8px}
.hero img{width:64px;height:64px;border-radius:50%;box-shadow:0 0 0 1px #C9A24B88,0 0 30px #C9A24B33}
.hero h1{font:600 clamp(18px,4.6vw,28px)/1.2 Cinzel,Georgia,serif;letter-spacing:.16em;margin:0;color:#E9CB82;text-shadow:0 2px 18px #000}
.hero p{margin:4px 0 0;font-size:13px;color:var(--mut)}
.bar{max-width:600px;margin:0 auto;padding:8px 16px 0}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut)}
.top button{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;cursor:pointer;padding:4px}
.track{height:5px;border-radius:5px;background:var(--line);margin-top:6px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#9A7420,#F0D58A);transition:width .5s}
main{max-width:600px;margin:0 auto;padding:16px 16px 30px}
#chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:90%;padding:11px 15px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.98)}}
.bot{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.me{background:var(--me);color:var(--mefg);border-bottom-right-radius:4px;align-self:flex-end;font-weight:600}
.dots{display:flex;gap:4px;padding:14px 16px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.sum{align-self:stretch;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--acc);border-radius:14px;padding:6px 16px;animation:in .35s ease-out}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.sum div:last-child{border:0}.sum span{color:var(--mut)}.sum b{text-align:right;font-weight:600}
#ctl{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt,.send,.act{font:600 15px "Public Sans",system-ui,sans-serif;border-radius:12px;padding:13px 16px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.opt{background:var(--card);backdrop-filter:blur(12px);color:var(--ink);border:1px solid var(--line);text-align:left}
.opt:hover{border-color:var(--acc);transform:translateX(4px)}
.send,.act{background:linear-gradient(180deg,#E6C877,#B88F33);color:var(--accfg);border:0;text-align:center;text-decoration:none;display:block}
.send:hover,.act:hover{transform:translateY(-1px)}
.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px}
.in,.sel{font:inherit;padding:13px;border-radius:12px;border:1px solid var(--line);background:rgba(10,10,12,.85);color:var(--ink);min-width:0}
.in{flex:1}.sel{width:84px}
.hint{color:var(--mut);font-size:13px;min-height:19px}.hint.e{color:var(--err)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
footer{max-width:600px;margin:0 auto;padding:0 16px 28px;color:var(--mut);font-size:12px}
@media(prefers-reduced-motion:reduce){.msg,.sum{animation:none}.dots i{animation:none}.fill{transition:none}}

#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:24px 20px calc(44px + env(safe-area-inset-bottom,0px));text-align:center;background:linear-gradient(180deg,#07070Ab8,#07070A00 38%,#07070Af0);transition:opacity 1s,visibility 1s}
#intro.off{opacity:0;visibility:hidden}
#intro img{width:88px;height:88px;border-radius:50%;box-shadow:0 0 0 1px #C9A24B99,0 0 50px #C9A24B44;animation:pop 1.3s cubic-bezier(.2,.9,.2,1) both}
#intro h2{font:600 clamp(28px,9vw,46px)/1.1 Cinzel,Georgia,serif;letter-spacing:.2em;margin:6px 0 0;background:linear-gradient(90deg,#B88F33,#FFF0B8,#B88F33);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite,rise 1.2s .3s both}
#intro p{margin:0;color:var(--mut);animation:rise 1.2s .6s both}
#intro .go{width:min(320px,100%);margin-top:10px;animation:rise 1.2s 1s both,glow 2.4s 2.2s infinite}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-25deg)}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes glow{50%{box-shadow:0 0 28px #E6C87799}}
.bot{position:relative;padding-left:48px;border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#E6C877aa,#2e2a1f 45%,#B88F3377) border-box;box-shadow:0 10px 30px #00000066}
.bot::before{content:"";position:absolute;left:11px;top:11px;width:27px;height:27px;border-radius:50%;background:var(--logo) center/cover;box-shadow:0 0 0 1px #C9A24B99}
.dots{padding:15px 16px 15px 48px}
.sum{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#E6C877,#5b4a1f,#B88F33) border-box;border:1px solid transparent;box-shadow:0 14px 40px #000000aa}
.send,.act{position:relative;overflow:hidden}
.send::after,.act::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,#fff7 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.send:hover::after,.act:hover::after{transform:translateX(120%)}
.sp{position:fixed;width:6px;height:6px;border-radius:50%;background:#F0D58A;pointer-events:none;z-index:9;box-shadow:0 0 10px #F0D58A;animation:sp .75s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@media(prefers-reduced-motion:reduce){#intro *{animation:none!important}.sp{display:none}}

body{overflow:hidden;height:100dvh}
#intro{background:linear-gradient(180deg,#0000 45%,#07070Af2)}
.app{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;max-width:640px;margin:0 auto;opacity:0;pointer-events:none;transition:opacity .9s .3s}
.app.on{opacity:1;pointer-events:auto}
.hd{position:relative;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:#0b0b0dd9;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd img{width:44px;height:44px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 1.5px #C9A24B;flex:none}
.who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.who b{font-size:15px}
.who small{color:var(--mut);font-size:12px}
.who small::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#5BD68A;margin-right:6px}
.tools{display:flex;gap:2px}.tools button{background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:6px;cursor:pointer}
.hd .track{position:absolute;left:0;right:0;bottom:-1px;height:3px;margin:0;border-radius:0}
main{max-width:none;margin:0;padding:14px 12px;flex:1;overflow-y:auto}
#chat{gap:6px}
.msg{padding:8px 12px 6px;max-width:84%}
.msg small{display:block;text-align:right;font-size:11px;opacity:.6;margin-top:2px;font-weight:400}
.bot,.dots{padding-left:13px}.bot::before{display:none}
.sys{align-self:center;max-width:92%;text-align:center;font-size:12px;color:var(--mut);background:#16161acc;border:1px solid var(--line);padding:6px 12px;border-radius:12px}
#ctl{margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#0b0b0de8;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);max-height:48vh;overflow-y:auto}
#ctl:empty{display:none}
.in{resize:none}textarea.in{min-height:76px}.row{align-items:flex-end}
.mic{width:50px;height:48px;flex:none;border-radius:12px;border:1px solid var(--line);background:rgba(10,10,12,.85);font-size:20px;cursor:pointer}
.mic.rec{background:#6b1c1c;border-color:#ff7b7b;animation:glow 1s infinite}
.pill{flex:1;display:flex;align-items:flex-end;min-width:0;background:rgba(10,10,12,.92);border:1px solid var(--line);border-radius:24px;padding:0 6px}
.pill:focus-within{border-color:var(--acc)}
.pill .in{border:0;background:transparent;padding:12px 10px;outline:none;border-radius:24px}
.rb{width:48px;height:48px;flex:none;border-radius:50%;border:0;background:#1FA855;color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .2s}
.rb:active{transform:scale(.92)}.rb.rec{background:#D93025;animation:glow 1s infinite}
.hint.rc{display:flex;align-items:center;gap:10px;color:#ff8a80}
.dot{width:9px;height:9px;border-radius:50%;background:#ff4d4d;animation:b 1s infinite}
.wv{display:flex;gap:3px;align-items:center;height:18px}.wv b{width:3px;height:6px;border-radius:2px;background:#ff8a80;animation:wv .8s ease-in-out infinite}
.wv b:nth-child(2){animation-delay:.1s}.wv b:nth-child(3){animation-delay:.2s}.wv b:nth-child(4){animation-delay:.3s}.wv b:nth-child(5){animation-delay:.4s}
@keyframes wv{50%{height:18px}}
</style>
</head>

const cap=s=>s.toLowerCase().replace(/(^|[\s-])([a-zà-ÿ])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\s(De|Da|Do|Das|Dos|E)(?=\s)/g,x=>x.toLowerCase());
function okName(v){const p=v.trim().split(/\s+/);if(p.length<2)return"Digite nome e sobrenome.";if(p.some(w=>w.length<2||!W.test(w)||!vowel(w)))return"Use apenas letras, sem números ou símbolos.";if(junk(v))return"Esse nome não parece válido. Confira a digitação.";return""}
const DDD=new Set("11 12 13 14 15 16 17 18 19 21 22 24 27 28 31 32 33 34 35 37 38 41 42 43 44 45 46 47 48 49 51 53 54 55 61 62 63 64 65 66 67 68 69 71 73 74 75 77 79 81 82 83 84 85 86 87 88 89 91 92 93 94 95 96 97 98 99".split(' '));
function okTel(v){const n=v.replace(/\D/g,'');if(n.length!==11)return"Digite o celular com DDD e 9 dígitos. Telefone fixo não recebe WhatsApp.";if(!DDD.has(n.slice(0,2)))return"DDD inexistente. Confira os dois primeiros dígitos.";if(n[2]!=='9'||!'6789'.includes(n[3]))return"Celular válido começa com 9 depois do DDD (exemplo: 35 99999-9999).";const s=n.slice(2);if(/^(\d)\1+$/.test(s)||'0123456789'.includes(s.slice(1))||'9876543210'.includes(s.slice(1)))return"Esse número não parece real. Confira a digitação.";return""}
const mask=v=>{const n=v.replace(/\D/g,'').slice(0,11);return n.length>7?`(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`:n.length>2?`(${n.slice(0,2)}) ${n.slice(2)}`:n};
const UFS="AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO".split(' ');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
const IC={mic:'<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2Z"/></svg>',send:'<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>'};
function mic(rb,f,h){
if(!SR){h.textContent='Este navegador não faz transcrição de voz. Digite, por favor.';h.className='hint e';say('Não entendi');return}
if(rec){rec.stop();return}
vozStop();
const base=f.value.trim()?f.value.trim()+' ':'';rec=new SR();rec.lang='pt-BR';rec.interimResults=true;rec.continuous=true;
rec.onresult=e=>{let s='';for(const r of e.results)s+=r[0].transcript;f.value=(base+s).slice(0,f.maxLength>0?f.maxLength:200);rb.upd()};
let sec=0;const iv=setInterval(()=>{sec++;const m=h.querySelector('.tm');if(m)m.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')},1000);
rec.onerror=e=>{h.textContent=/not-allowed|service/.test(e.error)?'O microfone está bloqueado aqui. Libere o acesso ou digite.':'Não entendi o áudio. Tente de novo ou digite.';h.className='hint e';say('Não entendi')};
rec.onend=()=>{clearInterval(iv);rec=null;rb.classList.remove('rec');if(h.classList.contains('rc')){h.className='hint';h.textContent=''}rb.upd()};
try{rec.start();rb.classList.add('rec');h.className='hint rc';h.innerHTML='<i class="dot"></i><span class="tm">0:00</span><span class="wv"><b></b><b></b><b></b><b></b><b></b></span><span>Gravando… toque para parar</span>'}catch(e){rec=null}}
function input({ph,check,mode,fmt,voice,multi,skip,norm}){return new Promise(res=>{
ctl.replaceChildren();const r=el('div','row'),p=el('div','pill'),f=el(multi?'textarea':'input','in'),rb=el('button','rb'),h=el('div','hint');
f.placeholder=ph;if(multi){f.rows=2;f.maxLength=400}else if(mode)f.inputMode=mode;f.autocomplete='off';rb.type='button';
rb.upd=()=>{rb.innerHTML=(voice&&!f.value.trim()&&!rec)?IC.mic:IC.send;rb.setAttribute('aria-label',voice&&!f.value.trim()?'Gravar áudio':'Enviar')};
const end=(txt,val)=>{if(rec)rec.stop();ctl.replaceChildren();me(txt);res(val)};
f.oninput=()=>{if(fmt)f.value=fmt(f.value);h.textContent='';h.className='hint';rb.upd()};
const go=()=>{const v=f.value.trim(),e=check(v);if(e){h.textContent=e;h.className='hint e';say('Não entendi');return}const o=norm?norm(v):v;end(o,o)};
rb.onclick=()=>{if(rec){rec.stop();return}if(voice&&!f.value.trim())mic(rb,f,h);else go()};
f.onkeydown=e=>{if(e.key==='Enter'&&!multi){e.preventDefault();go()}};
p.append(f);r.append(p,rb);rb.upd();ctl.append(r,h);
if(skip){const s=el('button','opt');s.textContent=skip;s.onclick=()=>end(skip,null);ctl.append(s)}
f.focus()})}
const CPF=/\b\d{3}\.?\d{3}\.?\d{3}-?\d{2}\b/,MAIL=/\S+@\S+\.\S+/;
function okRelato(v){const w=v.split(/\s+/);if(v.length<15||w.length<4)return"Conte um pouco mais, em uma ou duas frases.";if(junk(v.replace(/[^A-Za-zÀ-ÿ\s]/g,'')))return"Não consegui entender o texto. Confira.";if(CPF.test(v)||MAIL.test(v))return"Retire CPF e e-mail do texto. Esses dados não precisam ir aqui.";return""}
const pc=v=>{const m=v.match(/^(.*?)[\s,\-\/]+([A-Za-z]{2})$/);return m&&UFS.includes(m[2].toUpperCase())?{c:m[1].trim(),u:m[2].toUpperCase()}:{c:v,u:''}};
function okCity(v){const c=pc(v).c,p=c.split(/\s+/);if(c.length<3||p.some(w=>!W.test(w))||!vowel(c)||junk(c))return"Digite o nome de uma cidade válida, só com letras.";return""}
const normCity=v=>{const x=pc(v);return cap(x.c)+(x.u?'-'+x.u:'')};
const KW={"Previdenciário (INSS)":/inss|aposentad|benef[ií]cio|aux[ií]lio|pens[aã]o por morte|bpc|loas|per[ií]cia|previd/gi,"Trabalhista":/demit|demiss|empresa|patr[aã]o|carteira|fgts|rescis|horas? extras?|sal[aá]rio|trabalh|empregador/gi,"Consumidor":/compra|produto|loja|cobran[cç]a|cart[aã]o|banco|negativ|serasa|garantia|cancel|plano de sa[uú]de|entrega/gi,"Família":/div[oó]rcio|guarda|pens[aã]o aliment|uni[aã]o est[aá]vel|visita|separa[cç][aã]o|paternidade/gi,"Cível em geral":/alugu|despejo|contrato|indeniza|d[ií]vida|heran[cç]a|invent[aá]rio|vizinho|acidente/gi};
const sc=(a,v)=>(v.match(KW[a])||[]).length;
function guess(sel,v){let best=null,bs=0;for(const a in KW){if(a===sel)continue;const s=sc(a,v);if(s>bs){bs=s;best=a}}const cur=KW[sel]?sc(sel,v):0;return (bs>=2&&bs>cur)||(bs>=1&&cur===0)?best:null}
const URG=/audi[eê]ncia|prazo|intima[cç][aã]o|cita[cç][aã]o|urgente|despejo|bloque|penhora|liminar|amanh[aã]|semana que vem/i;
const FOLLOW={"Previdenciário (INSS)":["Qual é a situação do pedido?",["Benefício negado","Benefício cortado ou suspenso","Pedido em análise","Ainda vou pedir"]],"Trabalhista":["Você ainda trabalha nessa empresa?",["Sim, ainda trabalho","Fui demitido(a)","Pedi demissão","Trabalho sem carteira assinada"]],"Consumidor":["Você já tentou resolver com a empresa?",["Sim, sem sucesso","Ainda não","Fiz reclamação em órgão de defesa do consumidor"]],"Família":["Há filhos menores envolvidos?",["Sim","Não","Prefiro tratar com o advogado(a)"]],"Cível em geral":["Existe contrato ou documento por escrito?",["Sim","Não","Não sei"]],"Outro assunto":["Já existe processo em andamento sobre isso?",["Sim","Não","Não sei"]]};
function card(items){const c=el('div','sum');items.filter(x=>x[1]).forEach(([k,v])=>{const d=document.createElement('div'),s=document.createElement('span'),b=document.createElement('b');s.textContent=k;b.textContent=v;d.append(s,b);c.append(d)});chat.append(c);down()}
const TAGS={"demissão":/demit|demiss/i,"horas extras":/horas? extras?/i,"FGTS":/fgts/i,"carteira assinada":/carteira/i,"benefício do INSS":/inss|benef[ií]cio/i,"perícia":/per[ií]cia/i,"cobrança":/cobran[cç]a/i,"nome negativado":/negativ|serasa/i,"contrato":/contrato/i,"aluguel":/alugu/i,"guarda":/guarda/i,"pensão alimentícia":/pens[aã]o aliment/i,"divórcio":/div[oó]rcio/i,"audiência":/audi[eê]ncia/i,"intimação":/intima[cç][aã]o/i,"prazo":/prazo/i};
const tags=v=>Object.keys(TAGS).filter(k=>TAGS[k].test(v));
const VIOL=/viol[eê]ncia|agred|amea[cç]|espanc|abuso|medo (dele|dela|de ele|de ela)/i,SUIC=/suic[ií]d|me matar|tirar minha vida|n[aã]o aguento mais viver/i;
async function run(){
const hr=new Date().getHours(),sd=hr<12?'Bom dia':hr<18?'Boa tarde':'Boa noite';
step(1,'Início');sys('Hoje');sys('Conteúdo meramente informativo. Esta conversa não é consulta jurídica, não cria vínculo com advogado(a), não promete resultado e nada fica armazenado pela página.');
await bot(sd+"! Eu sou a Helena, assistente virtual do escritório "+CFG.banca+". Vou te fazer algumas perguntas rápidas para o escritório já te atender com tudo organizado.\n\nEsta conversa é uma triagem informativa: não é consulta jurídica e não há promessa de resultado.",450);
await bot("Antes, sobre os seus dados (LGPD): vou pedir seu nome, o assunto, um breve relato, a cidade e o WhatsApp, só para o escritório entrar em contato. Nada é enviado sem a sua autorização no final, e você pode pedir a exclusão quando quiser.\n\nNo relato, não coloque CPF, documentos nem detalhes de saúde. Se usar o microfone, a transcrição é feita pelo seu navegador ou aparelho.");
if(await choose(["Tudo bem, vamos lá","Agora não"])==="Agora não"){await bot("Sem problema. Nenhum dado foi coletado. Quando quiser, é só voltar.");ctl.replaceChildren();return}
step(2,'Nome');await bot("Perfeito! Como é o seu nome completo?");
const nome=await input({ph:'Nome e sobrenome',voice:true,check:okName,norm:cap}),pn=nome.split(' ')[0];
step(3,'Assunto');await bot("Prazer, "+pn+"! Sobre qual assunto você precisa de ajuda?");
let area=await choose(["Previdenciário (INSS)","Trabalhista","Consumidor","Família","Cível em geral","Outro assunto"]);
step(4,'Relato');await bot("Certo, "+pn+". Me conta, com as suas palavras, o que aconteceu. Pode ser em uma ou duas frases. Se preferir, toque no microfone e fale: eu transformo em texto.");
const rel=await input({ph:'Descreva o que aconteceu',multi:true,voice:true,check:okRelato,skip:'Prefiro explicar ao advogado(a)'});
if(rel){
if(SUIC.test(rel))await bot("Sinto muito que esteja tão difícil, "+pn+". Você não precisa passar por isso sozinho(a): o CVV atende pelo 188, 24 horas, por telefone ou chat. Se estiver em perigo agora, ligue 192 ou 190.");
if(VIOL.test(rel))await bot("Sinto muito pelo que você está passando. Se houver risco agora, ligue 190. Em casos de violência contra a mulher, a Central 180 atende 24 horas.");
const tg=tags(rel);await bot("Obrigada por contar, "+pn+"."+(tg.length?" Anotei estes pontos: "+tg.slice(0,5).join(", ")+".":" Já anotei o seu relato."));
const g=guess(area,rel);if(g){await bot("Pelo que você contou, o caso também parece envolver "+g+". Quer ajustar o assunto?");if((await choose(["Mudar para "+g,"Manter "+area])).startsWith("Mudar"))area=g}}
step(5,'Detalhe');const fq=FOLLOW[area]||FOLLOW["Outro assunto"];await bot(fq[0]);const det=await choose(fq[1]);
step(6,'Quando');await bot("E há quanto tempo isso aconteceu? Essa informação ajuda o advogado(a) a se preparar.");
const quando=await choose(["Nos últimos 30 dias","De 1 a 6 meses","De 6 meses a 2 anos","Mais de 2 anos"]);
step(7,'Prazo');await bot((rel&&URG.test(rel)?"Você falou de algo que pode ter data marcada. ":"")+"Existe algum prazo ou audiência marcada para os próximos 30 dias?");
const prazo=await choose(["Sim","Não","Não sei"]);
if(prazo==="Sim")await bot("Obrigada por avisar. Vou marcar como prioridade no resumo.");
step(8,'Cidade');await bot("Quase lá, "+pn+"! Em qual cidade você mora? Pode digitar só o nome da cidade.");
const cidade=await input({ph:'Cidade',voice:true,check:okCity,norm:normCity});
step(9,'WhatsApp');await bot("Falta pouco. Qual é o seu WhatsApp (celular com DDD)? É por ele que o escritório vai falar com você.");
const tel=await input({ph:'(00) 00000-0000',mode:'tel',fmt:mask,check:okTel});
await bot("Para evitar erro de digitação, digite o número mais uma vez.");
await input({ph:'Repita o WhatsApp',mode:'tel',fmt:mask,check:v=>v===tel?"":"Os números não são iguais. Confira e digite de novo."});
step(10,'Autorização');await bot("Prontinho! Dá uma conferida no resumo. Posso encaminhá-lo ao escritório para que entrem em contato com você pelo WhatsApp informado?");
const urg=prazo==="Sim"||(rel&&URG.test(rel));
card([["Nome",nome],["Assunto",area],["Relato",rel||""],["Detalhe",det],["Há quanto tempo",quando],["Prazo em 30 dias",prazo],["Cidade",cidade],["WhatsApp",tel]]);
if(await choose(["Sim, autorizo o encaminhamento","Não autorizo"])!=="Sim, autorizo o encaminhamento"){await bot("Tudo bem, "+pn+". Nada foi enviado e nada foi guardado por esta página. Se mudar de ideia, toque em Recomeçar.");ctl.replaceChildren();return}
const txt="Olá! Fiz a triagem pelo site e autorizo o contato.\nNome: "+nome+"\nAssunto: "+area+(rel?"\nRelato: "+rel:"")+"\nDetalhe: "+det+"\nHá quanto tempo: "+quando+"\nPrazo/audiência em 30 dias: "+prazo+(urg?"\nUrgência: possível prioridade":"")+"\nCidade: "+cidade+"\nWhatsApp: "+tel;
await bot("Tudo certo, "+pn+"! Toque no botão abaixo para enviar o resumo ao escritório; o envio só acontece quando você tocar nele.");
ctl.replaceChildren();
const a=el('a','act');a.textContent="Enviar resumo pelo WhatsApp";a.target="_blank";a.rel="noopener";a.href="https://wa.me/"+CFG.whats+"?text="+encodeURIComponent(txt);ctl.append(a);
const c=el('button','act alt'),h=el('div','hint');c.textContent="Copiar resumo";
c.onclick=async()=>{try{await navigator.clipboard.writeText(txt);h.textContent="Resumo copiado."}catch(e){h.textContent="Não foi possível copiar. Selecione o resumo e copie manualmente."}};
ctl.append(c,h);
}
$('go').onclick=()=>{started=true;snd=true;chime();vozPlay('welcome');['ok1','ok2','ok3','ok4','ok5','err'].forEach(k=>vozBuf(k).catch(()=>{}));$('intro').classList.add('off');$('app').classList.add('on');hitFn();run()};
</script>
